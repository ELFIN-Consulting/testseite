<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ELFIN Testseite</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 36rem;
        padding: 2rem;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.25rem 1rem;
      }
      dt {
        opacity: 0.7;
      }
      code {
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ELFIN Testseite</h1>
      <p>
        Diese Seite übt den Weg vom eigenen Rechner über GitHub auf den
        Hetzner-Server. Jeder Push auf <code>main</code> landet hier
        automatisch.
      </p>
      <dl>
        <dt>Commit</dt>
        <dd><code id="commit">–</code></dd>
        <dt>Gebaut</dt>
        <dd id="built">–</dd>
      </dl>
    </main>
    <script type="module">
      const response = await fetch("/version.json").catch(() => null);
      if (response?.ok) {
        const { commit, builtAt } = await response.json();
        document.getElementById("commit").textContent = commit;
        document.getElementById("built").textContent = new Date(
          builtAt,
        ).toLocaleString("de-DE");
      }
    </script>
  </body>
</html>
